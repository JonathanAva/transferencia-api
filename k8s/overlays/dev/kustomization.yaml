# Ambiente dev. La imagen se fija POR DIGEST en el despliegue:
#   kustomize edit set image ghcr.io/jonathanava/transferencia-api=ghcr.io/jonathanava/transferencia-api@sha256:<digest>
# El Secret "transferencia-api-secretos" (DB_USUARIO, DB_PASSWORD, CORE_USUARIO, CORE_PASSWORD) y el Secret
# "kong-config" (gateway/kong-dev.yaml completado) los crea el pipeline desde los secretos del environment "dev".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: transferencias-dev
labels:
  - pairs:
      app.kubernetes.io/environment: dev
    includeSelectors: false
resources:
  - namespace.yaml
  - ../../base
configMapGenerator:
  - name: transferencia-api-config
    literals:
      - SPRING_PROFILES_ACTIVE=dev
      - CORE_URL=https://core-dev.izalco.internal/core/transferencias
      - DB_URL=jdbc:postgresql://postgres-dev.izalco.internal:5432/transferencias
      - CORE_TIMEOUT_LECTURA=15s
      - DB_POOL_MAXIMO=5
patches:
  - target: { kind: Deployment, name: transferencia-api }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 512Mi } }
