# Base común a los tres ambientes. Cada overlay (k8s/overlays/<ambiente>) fija: namespace, réplicas,
# recursos, configuración no sensible (ConfigMap) y la imagen POR DIGEST (kustomize edit set image).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: transferencias
    includeSelectors: false
resources:
  - api-serviceaccount.yaml
  - api-deployment.yaml
  - api-service.yaml
  - kong-deployment.yaml
  - kong-service.yaml
