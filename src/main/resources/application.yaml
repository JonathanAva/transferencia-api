spring:
  application:
    name: transferencia-api
  jpa:
    # No mantener la sesión de base de datos abierta mientras se escribe la respuesta HTTP.
    open-in-view: false
    hibernate:
      # El esquema lo crea Flyway. Hibernate solo verifica que las entidades coincidan y,
      # si no coinciden, la aplicación no arranca.
      ddl-auto: validate

# Actuator: solo lo necesario para operar. Endpoints como env, beans o heapdump revelan
# configuración interna, por eso no se exponen.
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      # Sin detalles (nombre de la base, espacio en disco...) para quien consulte desde afuera.
      show-details: never
      # /actuator/health/liveness y /actuator/health/readiness para las sondas de Kubernetes.
      probes:
        enabled: true

# Core bancario legado.
# URL y credenciales llegan SOLO por variables de entorno (en Kubernetes, desde un Secret).
# El valor vacío después de ":" es intencional: si la variable no existe, la propiedad queda vacía,
# la validación de CoreProperties falla y la aplicación NO arranca (fail fast).
# Sin el ":" Spring dejaría el texto literal "${CORE_PASSWORD}", que pasaría la validación.
core:
  url: ${CORE_URL:}
  usuario: ${CORE_USUARIO:}
  password: ${CORE_PASSWORD:}
  # Conexión: corto. Si vence, la solicitud no llegó al core y se puede reintentar.
  timeout-conexion: ${CORE_TIMEOUT_CONEXION:2s}
  # Lectura: mayor que el p95 real del core (en el incidente: p95 9.8 s contra un timeout de 5 s).
  timeout-lectura: ${CORE_TIMEOUT_LECTURA:15s}

# Llaves de idempotencia (header X-Idempotency-Key).
idempotencia:
  # Tiempo durante el cual se recuerda una llave (replay). Después puede reutilizarse.
  expiracion: ${IDEMPOTENCIA_EXPIRACION:24h}
  # Una llave EN_PROCESO por más de (core.timeout-lectura + este margen) quedó "atrapada"
  # (p. ej. el pod murió a mitad de la llamada) y se cierra como resultado incierto, nunca se libera.
  margen-en-proceso: ${IDEMPOTENCIA_MARGEN_EN_PROCESO:30s}
